checkpoint:
  dir: ./checkpoints/ablations/no_gct_no_gcm
  every_n_epochs: 1
  monitor: val_loss
  save_top_k: 5
  mode: min
  save_last: true
dataset:
  augmentation: true
  num_workers: 4
  train_batch_size: 16
  val_batch_size: 32
  pin_memory: true
  prefetch_factor: 2
  drop_last: true
  persistent_workers: false
  test_batch_size: 32
experiment:
  name: ablation_no_gct_no_gcm
logger:
  log_dir: ./logs
  log_every_n_epochs: 1
  log_every_n_steps: 50
  project_name: ablation_no_gct_no_gcm
  type: tensorboard
  use_wandb: false
model:
  decoder:
    dropout: 0.2
    hidden_dim: 128
    num_classes: 1
    type: upernet_decoder
  fusion:
    dropout: 0.2
    type: concat
  gcm:
    enable: false
  gct:
    dropout: 0.2
    enable: false
    hidden_dim: 128
    num_heads: 8
    type: concat
  gis_encoder:
    dropout: 0.2
    hidden_dim: 64
    input_channels: 18
    output_dim: 64
    type: mlp_encoder
  grm:
    dropout: 0.2
    hidden_dim: 128
    num_layers: 3
    num_relations: 4
    type: graph_relation_module
  image_encoder:
    depths:
    - 2
    - 2
    - 18
    - 2
    drop_path_rate: 0.2
    embed_dim: 128
    num_heads:
    - 4
    - 8
    - 16
    - 32
    pretrained: true
    type: swin_transformer
    window_size: 7
  name: AblationModel
outputs:
  root_dir: ./outputs/ablations/no_gct_no_gcm
training:
  early_stopping:
    mode: min
    monitor: val_loss
    patience: 15
  epochs: 100
  gradient_accumulation_steps: 1
  loss:
    focal_alpha: 0.25
    focal_gamma: 2.0
    focal_weight: 0.0
    huber_delta: 0.1
    huber_weight: 0.5
    l1_weight: 0.5
    mse_weight: 1.0
    type: combined
  optimizer:
    lr: 0.0001
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0001
  gradient_clip_val: 1.0
  scheduler:
    T_max: 100
    eta_min: 1.0e-06
    type: cosine_annealing
    warmup_epochs: 5
