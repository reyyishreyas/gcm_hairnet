data:
  root_dir: "./data/processed"
  images_dir: "images"
  gis_dir: "gis"
  labels_dir: "labels"
  metadata_dir: "metadata"
  splits_file: "splits.json"
  normalization_stats: "./data/normalization_stats.json"
  image_size: 256
  gis_size: 32
  num_gis_channels: 18

dataset:
  train_batch_size: 16
  val_batch_size: 32
  test_batch_size: 32
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  drop_last: true
  persistent_workers: true
  augmentation: true
